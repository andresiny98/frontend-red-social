<div class="card shadow-sm mb-3">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <div>
        <strong>{{ post.author?.alias ?? post.author?.username }}</strong>
        <span class="text-muted small ms-2">{{ post.publishedAt | date: 'medium' }}</span>
      </div>
    </div>

    <p class="mb-3">{{ post.message }}</p>

    <button type="button" class="btn btn-sm" [class.btn-primary]="post.likedByMe"
      [class.btn-outline-primary]="!post.likedByMe" (click)="toggleLike()">
      {{ post.likedByMe ? 'Te gusta' : 'Me gusta' }} · {{ post.likesCount }}
    </button>
  </div>
</div>
