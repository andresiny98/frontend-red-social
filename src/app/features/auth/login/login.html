<div class="d-flex align-items-center justify-content-center login-wrapper">
  <div class="card shadow-sm login-card">
    <div class="card-body p-4">
      <h1 class="h4 mb-4 text-center">Iniciar sesión</h1>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input id="username" type="text" class="form-control" formControlName="username" autocomplete="username" />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Clave</label>
          <input id="password" type="password" class="form-control" formControlName="password"
            autocomplete="current-password" />
        </div>

        @if (error()) {
        <div class="alert alert-danger py-2">{{ error() }}</div>
        }

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
          @if (loading()) {
          Ingresando...
          } @else {
          Ingresar
          }
        </button>
      </form>
    </div>
  </div>
</div>
